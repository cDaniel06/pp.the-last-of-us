<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Last Of Us - Série</title>

    <link rel="stylesheet" href="./src/css/reset.css">
    <link rel="stylesheet" href="./src/css/estilos.css">
    <link rel="stylesheet" href="./src/css/responsivo.css">
</head>
<body>

<main>

    <!-- TOPO / BUSCA -->
    <header class="topo">
        <div class="search-container">
            <form action="#">
                <input type="text" placeholder="Pesquisar...">
                <button type="submit">Buscar</button>
            </form>

            <div class="login-container">
                <a href="pagina-de-login.html">Entrar</a>
                <a href="#">Cadastrar-se</a>
            </div>
        </div>
    </header>

    <!-- CARROSSEL -->
    <section class="carrossel">
        <img class="imagem ativa" src="./src/imagens/tlou-1.jpg" alt="fungo">
        <img class="imagem" src="./src/imagens/tlou-2.jpg" alt="personagem">
        <img class="imagem" src="./src/imagens/tlou-3.jpg" alt="Ellie e Joel">
        <img class="imagem" src="./src/imagens/tlou-4.jpg" alt="game">
        <img class="imagem" src="./src/imagens/tlou-5.jpg" alt="jogo">
        <img class="imagem" src="./src/imagens/tlou-6.jpg" alt="game">
    </section>

    <!-- CONTEÚDO PRINCIPAL -->
    <section class="conteudo">
        <div class="informacoes">
            <img class="logo" src="./src/imagens/logo.png" alt="logo the last of us">

            <p class="descricao">
                Em 26 setembro de 2003, um surto causado por um fungo conhecido como cordyceps causa pânico nos Estados Unidos...
            </p>
        </div>

        <div class="botoes-carrossel">
            <button class="botao selecionado"></button>
            <button class="botao"></button>
            <button class="botao"></button>
            <button class="botao"></button>
            <button class="botao"></button>
        </div>
    </section>

    <!-- MENU LATERAL -->
    <aside class="menu-lateral">
        <ul>
            <li>
                <a href="https://wa.me/5563992203671" target="_blank">
                    <img src="./src/imagens/whatsapp.png" alt="icone whatsapp" class="icone">
                </a>
            </li>
            <li>
                <img src="./src/imagens/github_icon_143196.png" class="icone">
            </li>
            <li>
                <a href="https://www.instagram.com/c.daniel1912/" target="_blank">
                    <img src="./src/imagens/instagram.webp" alt="logo instagram" class="icone">
                </a>
            </li>
            <li>
                <img src="./src/imagens/linkedin-computer-icons-social-media-blue-text-removebg-preview.png" class="icone">
            </li>
        </ul>
    </aside>

    <!-- VÍDEO RESPONSIVO -->
    <section class="video">
        <div class="video-wrapper">
            <iframe 
                src="https://www.youtube.com/embed/lW5kiEUVlpo"
                title="YouTube video player"
                frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen>
            </iframe>
        </div>
    </section>

</main>

<script src="./src/js/index.js"></script>
</body>
</html>
